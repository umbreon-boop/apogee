name: Build and Release
on:
  push:
    tags: ['v*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run build
      - uses: actions/upload-artifact@v7
        with:
          name: template-build
          path: target/artifact.lua
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: template-build
      - uses: softprops/action-gh-release@v3
        with:
          files: artifact.lua
  doc:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run doc.yml --ref main -R "$GITHUB_REPOSITORY"
